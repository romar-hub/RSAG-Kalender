name: n-tv RSS aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: n-tv RSS laden und umwandeln
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          url = "https://www.n-tv.de/rss"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (GitHub Actions RSS updater)"}
          )

          data = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(data)

          channel = root.find("channel")
          if channel is None:
              raise RuntimeError("Kein RSS-channel gefunden")

          out = ET.Element("rss", {"version": "2.0"})
          ch = ET.SubElement(out, "channel")

          def text(parent, tag):
              el = parent.find(tag)
              return (el.text or "").strip() if el is not None else ""

          ET.SubElement(ch, "title").text = "n-tv Nachrichten"
          ET.SubElement(ch, "link").text = "https://www.n-tv.de/"
          ET.SubElement(ch, "description").text = "Aktuelle Nachrichten von n-tv"
          ET.SubElement(ch, "language").text = "de"

          for item in channel.findall("item")[:20]:
              ni = ET.SubElement(ch, "item")
              ET.SubElement(ni, "title").text = text(item, "title")
              ET.SubElement(ni, "link").text = text(item, "link")
              ET.SubElement(ni, "description").text = text(item, "description")
              ET.SubElement(ni, "pubDate").text = text(item, "pubDate")
              guid = text(item, "guid") or text(item, "link")
              ET.SubElement(ni, "guid").text = guid

          tree = ET.ElementTree(out)
          ET.indent(tree, space="  ")
          tree.write("ntv.xml", encoding="utf-8", xml_declaration=True)
          print("ntv.xml aktualisiert")
          PY

      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ntv.xml
          git diff --cached --quiet || git commit -m "n-tv RSS aktualisieren"
          git push
